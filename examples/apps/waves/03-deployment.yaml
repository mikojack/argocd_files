apiVersion: apps/v1
kind: Deployment
metadata:
  name: waves-webapp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # A Deployment defaults to 600s before Kubernetes calls a rollout failed,
  # which means Argo CD would report Degraded ten minutes after a bad image.
  # One minute keeps the feedback loop inside the exercise.
  progressDeadlineSeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: waves-webapp
  template:
    metadata:
      labels:
        app: waves-webapp
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /
              port: 80
      volumes:
        - name: content
          configMap:
            name: waves-content
