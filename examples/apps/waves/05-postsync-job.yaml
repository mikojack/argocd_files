# Smoke test: runs only after every Sync resource is healthy.
apiVersion: batch/v1
kind: Job
metadata:
  name: waves-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: busybox:1.37
          command:
            - sh
            - -c
            - "wget -q -O - http://waves-webapp/ && echo 'smoke test passed'"
