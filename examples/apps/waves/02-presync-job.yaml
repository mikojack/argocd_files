# Stands in for a schema migration: it must finish before anything is applied.
apiVersion: batch/v1
kind: Job
metadata:
  name: waves-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    # Keep the pod after success so the logs stay readable during the exercise.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.37
          command: ["sh", "-c", "echo 'running migration'; sleep 10; echo done"]
