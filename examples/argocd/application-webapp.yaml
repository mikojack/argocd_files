apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
spec:
  project: training
  source:
    repoURL: https://gitlab.com/<your-fork>/argocd_files.git
    targetRevision: main
    path: examples/apps/webapp
  destination:
    server: https://kubernetes.default.svc
    namespace: training-webapp
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
