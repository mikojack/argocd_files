apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: waves
  namespace: argocd
spec:
  project: training
  source:
    repoURL: https://gitlab.com/greenitnet/argocd_files.git
    targetRevision: <your-branch>
    path: examples/apps/waves
  destination:
    server: https://kubernetes.default.svc
    namespace: training-waves
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
