apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-webapp
  namespace: argocd
spec:
  project: training
  source:
    repoURL: https://gitlab.com/greenitnet/argocd_files.git
    targetRevision: user2
    path: examples/apps/helm-webapp
    helm:
      releaseName: helm-webapp
      valueFiles:
        - values-dev.yaml
      parameters:
        - name: image.tag
          value: 1.29-alpine
  destination:
    server: https://kubernetes.default.svc
    namespace: training-helm
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
