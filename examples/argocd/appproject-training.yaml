# The course repository. Working on a fork instead? Put your fork's URL here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: training
  namespace: argocd
spec:
  description: Applications built during the Argo CD training
  sourceRepos:
    - https://gitlab.com/greenitnet/argocd_files.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: 'training-*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
