# Same application as application-webapp.yaml, with the wheel handed over.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
spec:
  project: training
  source:
    repoURL: https://gitlab.com/greenitnet/argocd_files.git
    targetRevision: <your-branch>
    path: examples/apps/webapp
  destination:
    server: https://kubernetes.default.svc
    namespace: training-webapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
