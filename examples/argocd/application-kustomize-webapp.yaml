apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-webapp
  namespace: argocd
spec:
  project: training
  source:
    repoURL: https://gitlab.com/greenitnet/argocd_files.git
    targetRevision: <your-branch>
    path: examples/apps/kustomize-webapp/overlays/dev
    kustomize:
      images:
        - nginx:1.29-alpine
  destination:
    server: https://kubernetes.default.svc
    namespace: training-kustomize
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
