# Reference pipeline for the CI/CD module.
#
# The application repository builds an image and then writes the new tag into
# THIS repository. It never talks to the cluster: no kubeconfig, no cluster
# secret, no kubectl. Argo CD notices the commit and syncs.
#
# Copy this into the application repository, not into the config repository --
# keeping the two apart is what stops the pipeline from triggering itself.

stages:
  - build
  - release

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  CONFIG_REPO: gitlab.com/<your-fork>/argocd_files.git

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"

# The deployment: a commit in the config repository. Nothing else.
release:
  stage: release
  image: alpine/git:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - apk add --no-cache curl
    - curl -sSL -o /usr/local/bin/kustomize-install
        https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh
    - sh /usr/local/bin/kustomize-install 5.4.3 /usr/local/bin
    - git clone "https://gitlab-ci-token:${CONFIG_REPO_TOKEN}@${CONFIG_REPO}" config
    - cd config/examples/apps/kustomize-webapp/overlays/prod
    - kustomize edit set image nginx=$IMAGE:$CI_COMMIT_SHORT_SHA
    - git -C ../../../../.. config user.email "ci@example.com"
    - git -C ../../../../.. config user.name "CI"
    - git -C ../../../../.. commit -am "prod: $CI_COMMIT_SHORT_SHA"
    - git -C ../../../../.. push origin main

# Optional: wait for the result instead of firing and forgetting.
# Needs an AppProject role token in ARGOCD_AUTH_TOKEN -- never the admin account.
#
#   argocd app wait kustomize-webapp --health --timeout 300
