# Optional variant of argocd-cluster.yaml for the ingress exercise.
#
#   kind create cluster --name argocd --config examples/kind/argocd-cluster-ingress.yaml
#
# The port mappings are what let an ingress controller inside the cluster answer
# on localhost. They are also the reason this file is optional: if anything on
# your machine already listens on 80 or 443, `kind create cluster` fails outright
# with "port is already allocated". Check with `ss -ltn` before you start.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # ingress-nginx's kind manifest schedules onto a node carrying this label.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
